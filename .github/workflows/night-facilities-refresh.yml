# 야간 운영시설(OSM·Overpass)을 주 1회 갱신해 커밋합니다.
#
# 기존 월간 수집(refresh-data.yml)과 분리한 이유: 소스·주기·장애 대응이 다르다.
# OSM은 공공 API와 달리 인증키가 필요 없고, 영업시간 변동이 드물어 주 1회면 충분하다.
# 수집 스크립트는 실패 시 기존 night-facilities.geojson을 보존하고 비정상 종료하므로,
# 이 워크플로가 실패해도 이전 데이터로 배포가 유지된다(커밋이 생기지 않음).
name: 야간 운영시설 주간 갱신

on:
  schedule:
    - cron: "0 18 * * 0" # 매주 일요일 18:00 UTC = 월요일 03:00 KST
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 야간 운영시설 수집 (실패 시 기존 데이터 유지)
        run: node scripts/fetch-night-facilities.mjs

      - name: 도로 점수 재계산
        run: npm run score-roads

      - name: 데이터·점수 정합성 검증
        run: npm test

      - name: 변경분 커밋·푸시
        run: |
          if git status --porcelain public/data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore: 야간 운영시설 주간 갱신 ($(date +%F))"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

      - name: 실패 시 알림 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create --title "야간 운영시설 주간 갱신 실패 — 로그 확인 필요" \
            --body "야간 운영시설(OSM Overpass) 수집 워크플로가 실패했습니다. [실행 로그](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }})를 확인하세요. 흔한 원인: Overpass API 장애·rate limit. 스크립트가 기존 night-facilities.geojson을 보존했으므로 서비스는 이전 데이터로 동작합니다."
