# 보안등 CSV는 동구청이 매년 말 기준으로 갱신합니다(현재 기준 2025-12-23).
# 매년 1월 15일(한국시간 오전 9시)에 갱신 알림 이슈를 자동으로 생성합니다.
# 주의: GitHub 예약 워크플로는 저장소 활동이 60일 없으면 자동 정지되므로,
# 정지 시 Actions 탭에서 이 워크플로를 다시 enable 하거나, 시기에 맞춰 "Run workflow"로 수동 실행하세요.
name: 보안등 데이터 갱신 알림

on:
  schedule:
    - cron: "0 0 15 1 *" # 매년 1월 15일 09:00 KST
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: 갱신 알림 이슈 생성 (열린 이슈 중복 시 건너뜀)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="보안등 CSV 갱신 필요 — 동구청 연말 기준자료"
          if gh issue list --state open --search "$TITLE in:title" | grep -q .; then
            echo "이미 알림 이슈가 있어 건너뜁니다."
            exit 0
          fi
          gh issue create --title "$TITLE" --body-file - <<'EOF'
          ## 해야 할 일

          보안등 자료는 동구청이 **매년 말 기준**으로 재공표합니다. 새 자료가 나왔는지 확인하고 저장소에 반영해 주세요.

          1. [공공데이터포털](https://www.data.go.kr) 또는 [안전디딤돌](https://www.safemap.go.kr)에서 최신 `전남광주통합특별시 동구 보안등정보` CSV를 내려받기
          2. `scripts/data/donggu-streetlights.csv` 파일 교체
          3. 반영 실행:
             ```bash
             node scripts/fetch-real-data.mjs --only=streetlights
             ```
          4. `public/data/meta.json`의 `sources.streetlight.dataAsOf`가 새 기준일로 바뀌었는지 확인
          5. `npm run build` 후 커밋·배포

          ## 참고

          - 현재 적용 기준일은 `public/data/meta.json`의 `sources.streetlight.dataAsOf`에서 확인할 수 있습니다.
          - CCTV·비상벨·편의점도 함께 갱신하려면 `node scripts/fetch-real-data.mjs`(전체, 약 15분)를 실행하세요.
          - 이 이슈는 매년 1월 15일 자동 생성됩니다. 처리했으면 닫아 주세요.
          EOF
