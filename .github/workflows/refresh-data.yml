# 매월 공공데이터(CCTV·비상벨·편의점·CPTED·버스정류장·빈집)를 자동 수집해 커밋합니다.
# 커밋이 푸시되면 Vercel이 자동으로 재배포합니다.
#
# 사전 준비(한 번만): 저장소 Settings → Secrets and variables → Actions에 등록
#   - SAFEMAP_SERVICE_KEY  (안전디딤돌 오픈API 인증키)
#   - MOIS_SERVICE_KEY     (행안부 및 경찰청 odcloud API 공용 인증키)
#   - VWORLD_API_KEY       (VWORLD Geocoder API 인증키; 2D 데이터 API 폴백)
#   - VWORLD_DATA_API_KEY  (VWorld 2D 데이터 API 인증키, Geocoder 키와 별도 관리 가능)
#   - KAKAO_REST_API_KEY   (경찰청 관서 주소 좌표 변환)
#   - TAGO_SERVICE_KEY    (버스정류소정보; 승하차 ZIP은 분기별 수동 반영)
#   - ROAD_LIGHT_SERVICE_KEY (동구 가로등현황 odcloud 일반 인증키)
# 선택: Variables → VWORLD_DOMAIN (VWORLD에 등록한 서비스 URL)
#
# 보안등은 공개 API가 없어(동구청 CSV 수동 교체) 자동 수집 대상이 아닙니다.
# 보안등 갱신 알림은 security-light-refresh-reminder.yml을 참고하세요.
name: 공공데이터 월간 자동 수집

on:
  schedule:
    - cron: "0 0 5 * *" # 매월 5일 09:00 KST
  workflow_dispatch:
    inputs:
      only:
        description: "수집 대상 (all: 전체, road-lights: 가로등, cpted: CPTED, police: 경찰시설, bus: 정류장, vacant: 빈집)"
        type: choice
        default: all
        options: [all, road-lights, cpted, police, bus, vacant]

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - uses: actions/setup-python@v5
        if: ${{ inputs.only == 'all' || inputs.only == '' }}
        with:
          python-version: '3.11'

      - name: 도로명·도시계획상 종류 보강
        if: ${{ inputs.only == 'all' || inputs.only == '' }}
        env:
          VWORLD_DATA_API_KEY: ${{ secrets.VWORLD_DATA_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
        run: |
          pip install -r scripts/requirements-roads.txt
          python scripts/enrich_vworld_roads.py

      - name: 데이터 수집
        env:
          SAFEMAP_SERVICE_KEY: ${{ secrets.SAFEMAP_SERVICE_KEY }}
          MOIS_SERVICE_KEY: ${{ secrets.MOIS_SERVICE_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
          TAGO_SERVICE_KEY: ${{ secrets.TAGO_SERVICE_KEY }}
          ROAD_LIGHT_SERVICE_KEY: ${{ secrets.ROAD_LIGHT_SERVICE_KEY }}
          VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ "$ONLY" = "cpted" ] || [ "$ONLY" = "police" ] || [ "$ONLY" = "bus" ] || [ "$ONLY" = "vacant" ] || [ "$ONLY" = "road-lights" ]; then
            node scripts/fetch-real-data.mjs --only="$ONLY"
          else
            node scripts/fetch-real-data.mjs
          fi

      - name: 도로 점수·입력 데이터 정합성 검증
        run: npm test

      - name: 변경분 커밋·푸시
        run: |
          if git status --porcelain public/data scripts/data/road-segments.geojson | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data scripts/data/road-segments.geojson
            git commit -m "chore: 공공데이터 월간 갱신 ($(date +%F))"
            git push
          else
            echo "변경 없음 — 커밋 생략"
          fi

      - name: 실패 시 알림 이슈 생성
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create --title "공공데이터 자동 수집 실패 — 로그 확인 필요" \
            --body "월간 자동 수집 워크플로가 실패했습니다. [실행 로그](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }})를 확인하세요. 흔한 원인: API 일일 한도 초과, 인증키 만료·미등록(Secrets), 데이터 형식 변경. 수집 스크립트는 자가검사로 비정상 데이터 커밋은 차단합니다."
